name: Install apt packages
description: Install Ubuntu packages without allowing apt mirrors to hang a job indefinitely

inputs:
  packages:
    description: Whitespace-separated package names
    required: true
  timeout-seconds:
    description: Wall-clock limit for each apt invocation
    required: false
    default: '300'

runs:
  using: composite
  steps:
    - name: Install requested packages
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
        APT_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: |
        set -euo pipefail

        if [[ ! "$APT_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::timeout-seconds must be a positive integer"
          exit 2
        fi

        read -r -a packages <<< "$APT_PACKAGES"
        if (( ${#packages[@]} == 0 )); then
          echo "::error::packages must contain at least one package name"
          exit 2
        fi

        missing=()
        for package in "${packages[@]}"; do
          if [[ ! "$package" =~ ^[A-Za-z0-9][A-Za-z0-9+.:_~-]*$ ]]; then
            echo "::error::invalid apt package name: $package"
            exit 2
          fi
          if ! dpkg-query -W -f='${db:Status-Status}\n' "$package" 2>/dev/null |
            grep -Fxq installed; then
            missing+=("$package")
          fi
        done

        if (( ${#missing[@]} == 0 )); then
          echo "All requested apt packages are already installed"
          exit 0
        fi

        echo "Missing apt packages: ${missing[*]}"

        # Installing a -dev package can upgrade the runtime library it pins
        # (libudev-dev pins libudev1), and with it systemd and udev, whose
        # initramfs trigger adds a slow configure step. A hosted runner never
        # boots its initramfs, so make the hook a documented no-op for the job.
        initramfs_conf=/etc/initramfs-tools/update-initramfs.conf
        if [[ -f "$initramfs_conf" ]]; then
          if grep -q '^update_initramfs=' "$initramfs_conf"; then
            sudo sed -i 's/^update_initramfs=.*/update_initramfs=no/' "$initramfs_conf"
          else
            echo 'update_initramfs=no' | sudo tee -a "$initramfs_conf" > /dev/null
          fi
        fi

        bounded_apt() {
          sudo env DEBIAN_FRONTEND=noninteractive \
            timeout --signal=TERM --kill-after=15s "${APT_TIMEOUT_SECONDS}s" \
            apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o DPkg::Lock::Timeout=60 \
            "$@"
        }

        # A timeout that lands during dpkg's configure phase leaves dpkg
        # interrupted, and apt then refuses every later install until it is
        # completed. Finish any interrupted configuration before each retry.
        recover_dpkg() {
          sudo env DEBIAN_FRONTEND=noninteractive \
            timeout --signal=TERM --kill-after=15s "${APT_TIMEOUT_SECONDS}s" \
            dpkg --configure -a || true
        }

        # Hosted runners normally retain usable indexes. Avoid contacting every
        # configured mirror when those indexes can satisfy the install directly.
        if bounded_apt install -y --no-install-recommends "${missing[@]}"; then
          exit 0
        fi

        for attempt in 1 2; do
          echo "apt refresh/install attempt $attempt of 2"
          recover_dpkg
          if bounded_apt update &&
            bounded_apt install -y --no-install-recommends "${missing[@]}"; then
            exit 0
          fi
          if (( attempt < 2 )); then
            sleep 10
          fi
        done

        # The hosted runners' mirror list (mirror+file:/etc/apt/apt-mirrors.txt,
        # the Azure mirror first) intermittently serves a stale index or 404s a
        # package that exists. Retry once against the canonical archive instead.
        echo "apt refresh/install attempt 3 of 3: canonical archive"
        recover_dpkg
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://security.ubuntu.com/ubuntu/\tpriority:2\n' |
            sudo tee /etc/apt/apt-mirrors.txt > /dev/null
        fi
        if bounded_apt update &&
          bounded_apt install -y --no-install-recommends "${missing[@]}"; then
          exit 0
        fi

        echo "::error::apt package installation failed after bounded retries"
        exit 1
