# cargo-about configuration for the release-binary third-party attribution.
#
# The generated file is THIRD_PARTY_LICENSES.md at the repository root. It
# accompanies the prebuilt `rumoca` and `rumoca-lsp` binaries published to
# GitHub Releases: those are statically linked, so they embed the code of every
# crate below, and every license below conditions redistribution on the notice
# being reproduced.
#
# Regenerate with infra/licenses/generate.sh. Do not hand-edit the output.

# The published binaries are built with default features (see the release job
# in .github/workflows/ci.yml: `cargo build --release --bin rumoca --bin
# rumoca-lsp`), which is what this configuration resolves. Note that
# `transport-zenoh` IS in that set: it is optional in `rumoca-sim` but a default
# feature of the `rumoca` binary crate, so the Zenoh ecosystem is linked into
# the shipped binary and is attributed accordingly.
workarounds = ["ring"]

# Targets the release job builds for. A crate reachable on none of these is not
# in any published binary.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Build-only and dev-only dependencies are not linked into the shipped binary,
# so they carry no redistribution obligation.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Accepted licenses, in preference order. For a dual-licensed crate cargo-about
# selects the first entry that the crate offers. Apache-2.0 leads because
# rumoca itself is Apache-2.0, which keeps the shipped combination governed by
# one license wherever the dependency gives us the choice; MIT follows for the
# MIT-only crates.
#
# Every entry below is permissive or, in the EPL/GPL/LGPL dual cases, offers a
# permissive alternative that is selected here. MPL-2.0 (option-ext, reached
# through dirs -> dirs-sys) is file-level copyleft and is accepted knowingly:
# MPL section 3.2 obliges us to tell recipients how to obtain that crate's
# source, which THIRD_PARTY_LICENSES.md does. Adding a license to this list is
# a deliberate compliance decision, not a build fix.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OpenSSL",
    "MIT-0",
]

# Private (workspace-local) crates are rumoca's own Apache-2.0 code, covered by
# the root LICENSE rather than by third-party attribution.
[private]
ignore = true
registries = []
