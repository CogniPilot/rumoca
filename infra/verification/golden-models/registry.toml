[[models]]
id = "ParameterDecay"
profile = "parameter-decay-v1"

[models.claim]
kind = "candidate"

[models.claim.details]
reason = "Every endpoint of the parameter-decay-v1 profile is observed or typed-refused by the bound tests: the native RK trace matches x(t) = 2 exp(-t) within 1e-9 on the 0.1 output grid, the derivative kernel is the exact LoadP, LoadY, Mul, StoreOutput program over the P column with the binding evaluated bit-exactly to -1.0, and the direct and registered eFMI refusals are typed at the state. The C61 equation-refinement receipt is not in the profile because the profile admits exactly one DAE variable and this model declares two, so no receipt can be minted or owed. The claim stays candidate: no coverage footprint is bound because the capture at this check ran all three scenarios to a pass but its merge was refused when crates/rumoca-eval-flat/src/phase_constant/mod.rs changed between scenario runs; the record's admission criteria that the MLS 3.6 4.8.1 parameter fixed default be decided at one site and that the parameter write policy be exercised through FMI3 generated C are open; and the tree is under revision, so a pinned binding would go stale as the UnitDerivative binding already has."
last_compliance_check = "2026-09-04T04:25:09Z"

