[[models]]
id = "UnitDerivative"
profile = "unit-derivative-v1"

[models.claim]
kind = "candidate"

[models.claim.details]
reason = "Demoted from reviewed on 2026-09-05 after full-cone adversarial review began. Four slices of the measured cone were reviewed against the frozen footprint (rumoca-ir-solve, rumoca-phase-solve, rumoca-phase-flatten/pipeline, rumoca-phase-parse; 14048 of 51472 covered lines, 27 percent). All four returned does-not-pass on correct-by-construction or DRY grounds, so the prior claim that C61 was the only outstanding proof endpoint is false. No finding produces a wrong output for this model today: every one is either a proof that does not prove what it claims, or a correctness that holds by accident of this model's size. Two obligations were shown to be vacuous at one state because count equals identity: the FMI state/derivative correspondence check at rumoca-ir-solve/src/fmi.rs:634-638, and the C61 executable-owner census, which was proven inert by a shape-preserving mutation that left all 171 phase-solve tests and every C61 architecture gate green. The native endpoint observes only RK45 backend selection, finite strictly increasing timestamps with interval endpoints, and x = 2 + t within 1e-13 at each observed time. Because the derivative is constant, it does not witness the requested interior grid, RK45 order, dense-interior coefficients or accuracy, step rejection, PI control, or error-control behavior. The claim returns to reviewed only after the findings are closed, a non-self-referential production snapshot and semantic evidence checker exist, the candidate footprint is recaptured at a quiesced tree, and the remaining 73 percent of the cone is reviewed."
last_compliance_check = "2026-09-04T08:14:36Z"

