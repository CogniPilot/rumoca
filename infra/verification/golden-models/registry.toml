# Production binding. The bytes the evidence was produced against are not a
# curated file list; they are the measured line-coverage footprint of
# compiling this model, written by `cargo xtask coverage golden UnitDerivative`
# to `target/golden-coverage/UnitDerivative/footprint.json` and checked in
# beside this registry. The footprint names production lines the bound
# scenarios executed and records source digests as candidate review input.
# Schema 2 validates this outer binding only; it does not trust the footprint's
# self-recorded file digests, treat coverage as semantic evidence, or use the
# capture as a non-self-referential production snapshot. Candidates contribute
# zero aggregate coordinates. Reviewed admission remains a typed refusal until
# independent snapshot and semantic-evidence checkers are implemented.

