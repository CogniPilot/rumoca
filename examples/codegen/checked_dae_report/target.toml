version = 1
ir = "dae"
name = "checked-dae-report-example"
description = "Readable report over the canonical checked DAE template projection"
execution_mode = "source-transform"
deployment_class = "text"

[capabilities]
continuous_states = true
residual_equations = true
structured_equation_families = true
external_functions = true
external_tables = true
random = true
initialization = true
events = true
runtime_events = true
clocks = true
dynamic_ranges = true
dynamic_derivative_subscripts = true

[[files]]
path = "{{ model_name }}_checked_dae.txt"
template = "checked_dae_report.txt.jinja"
