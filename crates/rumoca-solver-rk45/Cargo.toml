[package]
name = "rumoca-solver-rk45"
description = "Pure-Rust RK45 simulation backend for Rumoca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# SPEC_0038 §Internal Solver Boundary: this crate is an FMI 3 ME *host*. It
# depends on the ME contract only. `rumoca-ir-solve` and `rumoca-eval-solve`
# are deliberately absent so naming a Solve row, layout, opcode, event, or
# runtime object here does not compile.
rumoca-solver = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Unit-test fixtures build Solve models by hand. A dev-dependency is not
# linked into the library, so the SPEC_0038 boundary above still holds for
# every production path in this crate.
rumoca-ir-solve = { workspace = true }

[lints]
workspace = true
