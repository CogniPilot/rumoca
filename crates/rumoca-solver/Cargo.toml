[package]
name = "rumoca-solver"
description = "Backend-neutral simulation contracts and runtime helpers for Rumoca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["sparse-linalg"]
sparse-linalg = ["dep:faer"]
# A feature-gated harness that lets an out-of-crate numerical backend drive a
# real integrator through the checked retained-handle and activation contract.
# It carries no production surface and is enabled only by backend test builds.
test-support = []

[dependencies]
faer = { workspace = true, optional = true }
indexmap = { workspace = true }
rumoca-core = { workspace = true }
rumoca-eval-solve = { workspace = true }
rumoca-ir-solve = { workspace = true }
rustc-hash = { workspace = true }
nalgebra = "0.34"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
instant = { version = "0.1", features = ["wasm-bindgen"] }

[dev-dependencies]
proptest = { workspace = true }
rumoca-phase-solve = { workspace = true }
# SPEC_0039 / SOLVE-C17: pattern fixtures are a test-only surface. Declaring
# the feature here and nowhere else keeps it out of every production build of
# this crate.
rumoca-ir-solve = { workspace = true, features = ["pattern-fixtures"] }

[lints]
workspace = true
