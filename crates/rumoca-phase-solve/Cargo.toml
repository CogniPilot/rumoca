[package]
name = "rumoca-phase-solve"
description = "Lower DAE-IR into solver-facing row IR plus AD support"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
tracing = ["dep:tracing"]

[dependencies]
rumoca-core = { workspace = true }
rumoca-ir-dae = { workspace = true }
rumoca-ir-solve = { workspace = true }
rumoca-ir-galec = { workspace = true }
rumoca-eval-dae = { workspace = true }
rumoca-phase-structural = { workspace = true }
# State selection settles trial points by evaluating pure calls at
# translation time, which is reference evaluation. Every consumer of this
# crate translates models, so the edge enables it; the compiled guest does
# not depend on this crate (rumoca-sim `lowering`).
rumoca-eval-solve = { workspace = true, features = ["reference-eval"] }
rumoca-eval-galec = { workspace = true }
indexmap = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true }
rumoca-eval-solve = { workspace = true, features = ["wire-replay"] }
serde_json = { workspace = true }

[lints]
workspace = true
