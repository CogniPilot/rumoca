[package]
name = "rumoca-runtime-fmi-ls"
description = "Fixed FMI-LS WIT adapter over the existing retained ME owner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Build-only: adds the `rumoca-preinit` export for build-time snapshotting.
# The published component never carries it.
preinit = []
# Build-only: the build-time linked certification entry (`certify_linked`), wired
# into the build-only certification world by the packager runner. It must enable
# no other feature: the certifying core certifies the published core's emission
# only while both build every kernel path identically (lib.rs test).
certify-linked = []
# Build-time product kind: a stateful (scalar) component instead of the
# stateless native product. Interpreted until linked dispatch lands (M1a).
# Its fixed guest imports no native model entry.
# Interpreted bring-up product: the one guest product that compiles
# reference execution. The linked product below never does.
scalar-product = ["rumoca-exec-wasm/fixed-scalar-guest-receiver", "rumoca-solver/reference-execution"]
# Build-time product kind: the compiled stateful component. Its saved
# programs run as linked entries through the issued dispatch, certified
# against the linked artifact; it never enables `scalar-product`.
scalar-linked-product = ["dep:rumoca-sim", "rumoca-exec-wasm/fixed-scalar-linked-receiver"]

[dependencies]
rumoca-solver = { path = "../rumoca-solver", default-features = false, features = ["sparse-linalg", "native-wasm"] }
rumoca-ir-solve = { workspace = true }
rumoca-solver-rk45 = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi", target_env = "p2"))'.dependencies]
wit-bindgen = { version = "=0.43.0", default-features = false, features = ["macros", "realloc"] }
rumoca-exec-wasm = { path = "../rumoca-exec-wasm", default-features = false, features = ["fixed-native-guest-receiver"] }
rumoca-sim = { path = "../rumoca-sim", default-features = false, features = ["linked-guest"], optional = true }

[dev-dependencies]
rumoca-compile = { workspace = true }
rumoca-exec-wasm = { workspace = true, features = ["host-engine"] }
rumoca-sim = { workspace = true, features = ["fmi"] }

[lints]
workspace = true
