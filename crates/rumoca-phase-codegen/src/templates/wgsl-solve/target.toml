version = 1
ir = "solve"
name = "wgsl-solve"
description = "WGSL compute-shader derivative and implicit residual kernels for WebGPU execution (browser and native wgpu)"
execution_mode = "jit"
deployment_class = "gpu"
readiness_level = 0

[capabilities]
residual_equations = true
scalar_fallback = true
# Condition/relation slots can be inputs to continuous kernels, but this target
# emits neither root/action kernels nor event iteration. Eventful models must
# therefore fail before rendering; a host warning is not semantic support.
events = false
runtime_events = false
forward_ad = false
reverse_ad = false
dynamic_control_flow = false
host_callbacks = false

[capabilities.tensor]
matmul = "scalar"
elementwise = "native"
stencil = "native"
reductions = "scalar"
layout = "row-major"
supports_dynamic_shapes = false
sparse = false
dtypes = ["f32"]

[[files]]
path = "{{ model_name }}_solve.wgsl"
template = "model_solve.wgsl.jinja"

[[files]]
path = "{{ model_name }}_layout.json"
template = "model_layout.json.jinja"
