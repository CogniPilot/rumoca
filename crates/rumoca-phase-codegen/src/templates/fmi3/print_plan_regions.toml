schema = "SolveUnaryToken"
[[region.argument]]
name = "a"
schema = "RenderedOperand"
[[region.tag]]
path = "token"
schema = "SolveUnaryToken"
variants = ["negate", "not", "sign", "integer_abs", "real_abs", "ceiling", "truncate", "sqrt", "floor", "sin", "cos", "tan", "asin", "acos", "atan", "sinh", "cosh", "tanh", "exp", "log", "log10"]

