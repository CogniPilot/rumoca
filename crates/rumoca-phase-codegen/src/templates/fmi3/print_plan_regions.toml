# Decoded print-plan regions: macro regions whose whole production output a
# blocking print-plan conformance decoder consumes. The template check
# (`cargo xtask verify lint`) reads this file; the conformance tests read the
# same file and prove each region is invoked and decoded in production.
#
# Malformed entries fail the gate; nothing is filtered. A row lets its region
# dispatch on the listed closed issued tags and call the
# other decoded regions of its file, and hands its literal text to the
# decoder's reviewed spelling table. Every other template rule still applies,
# and the region must also be in COVERED_MACROS.
#
# [[region]]
# file = "fmi3/<template>.jinja"
# macro = "<name>"
# consumer = "<the production route that renders it>"
# decoder = "<the blocking conformance test that consumes its output>"
# [[region.argument]]            (one per macro argument, in order)
# name = "<argument>"
# schema = "<the issued type it receives>"
# [[region.tag]]
# path = "<argument>.<field>..."   (or the argument itself, when its schema is the tag's)
# schema = "<the issued Solve IR type the tag belongs to>"
# variants = ["<each serialized variant>", ...]

[[region]]
file = "fmi3/typed_functions.jinja"
macro = "element"
consumer = "fmi3 typed function definition()"
decoder = "rumoca-phase-codegen print_plan_conformance_tests"
[[region.argument]]
name = "token"
schema = "SolveElementToken"
[[region.tag]]
path = "token"
schema = "SolveElementToken"
variants = ["real64", "int64", "boolean"]

[[region]]
file = "fmi3/typed_functions.jinja"
macro = "storage_name"
consumer = "fmi3 typed function definition()"
decoder = "rumoca-phase-codegen print_plan_conformance_tests"
[[region.argument]]
name = "name"
schema = "SolveName"
[[region.tag]]
path = "name.space"
schema = "SolveNameSpace"
variants = ["slot", "register"]

