version = 1
ir = "algorithm-code"
name = "embedded-c-galec"
# Conformance (SPEC_0034 GAL-024, two-track rule): this target is the
# non-eFMI track — a GALEC-derived embedded C export that may exist
# independently of any container. It is NOT an eFMI Production Code
# container: no LogicalData/BlockMethods manifest mapping, no checksummed
# ManifestReference, no co-emitted Algorithm Code container. The eFMI
# Algorithm Code rung is the separate `galec` target.
description = "GALEC-derived embedded C export (block-state struct + startup/recalibrate/dostep over the projected GALEC block) for fixed-sample discrete models — NOT an eFMI Production Code container (SPEC_0034 GAL-024)"
execution_mode = "compiled"
deployment_class = "cpu"
readiness_level = 2
completion_message = """GALEC-derived embedded C sources compiled to: {{ out_dir }}
  rumoca_galec_kernels.h  shared array-kernel prototypes (model-independent)
  rumoca_galec_kernels.c  shared array-kernel definitions (model-independent)
  {{ model_name }}.h   block-state struct + startup/recalibrate/dostep prototypes
  {{ model_name }}.c   method definitions printed from the projected GALEC block
This is a GALEC-derived embedded C export, NOT an eFMI Production Code
container (SPEC_0034 GAL-024): no eFMU manifest mapping is emitted.
Safety assurance: designed for the MISRA C:2023 profile in GAL-029/030;
MISRA compliance and DO-178C compliance are not claimed.
Compile preflight: cc -O2 -std=c99 -pedantic -Wall -Wextra -Wconversion
  -Wsign-conversion -Wshadow -Wundef -Wcast-qual -Wstrict-prototypes
  -Wmissing-prototypes -Werror -c {{ out_dir }}/rumoca_galec_kernels.c {{ out_dir }}/{{ model_name }}.c
Both translation units must be compiled; the model calls into the kernel
library and checks RUMOCA_GALEC_KERNELS_VERSION against the header beside it."""

# GAL-028: the target's Integer execution domain. The generated C computes
# Integer arithmetic on int32_t, so declare that domain here like the galec
# and galec-production targets do; range-proof enforcement over this domain
# is tracked pre-cutover work (see SPEC_0034 GAL-028/GAL-030).
[integer]
minimum = -2147483648
maximum = 2147483647

# Generic DAE capability gates (SPEC_0034 GAL-006), copied verbatim from
# the galec target: both consume the same DAE → GALEC projection, so
# admissibility is identical. The gates run before any rendering; the
# projection re-checks admissibility on the untouched DAE afterwards
# (GAL-004, additive) and owns the projection-scope wording (GAL-025).
[capabilities]
continuous_states = false
residual_equations = false
external_functions = false
external_tables = false
random = false
initialization = false
events = true
runtime_events = false
clocks = true
dynamic_ranges = false
dynamic_derivative_subscripts = false
forward_ad = false
reverse_ad = false
dynamic_control_flow = false
host_callbacks = false

# Support partial (renders no product file): the single declaration site of
# the GALEC-derived C symbol policy and of the two symbol tables every C
# artifact prints from. `name` publishes it to the shared render environment,
# so this target's own artifacts AND the galec-production ProductionCode
# artifacts read one allocation instead of copied reserved lists. A
# `[[partials]]` entry is mutually exclusive with a `[[files]]` entry: this
# file has no product path because rendering it yields no artifact.
[[partials]]
template = "symbols.jinja"
name = "galec-c-symbols.jinja"

[[partials]]
template = "scratch.jinja"
name = "galec-c-scratch.jinja"

# D2/GAL-008 split: Rust lowers to a closed typed semantic context
# (collision-checked names, typed variables, recursive expressions/statements,
# and normalized array operations). These templates own every C token,
# declaration, expression, statement, comment escape, and file-layout choice.
#
# `shared_as` publishes each artifact template to the shared render
# environment as well: the GALEC-derived C body is target-agnostic, and
# galec-production's ProductionCode artifacts `{% extends %}` these exact
# files to override only their conformance banner.
# The shared array-kernel library. It is MODEL-INDEPENDENT: these two files
# carry no model view at all, and one compiler build emits byte-identical bytes
# for every block it compiles. That is deliberate — an integrator linking
# several generated blocks into one application compiles one copy and dedups
# the rest by content — so they are declared unconditionally rather than
# subsetted per model.
[[files]]
path = "rumoca_galec_kernels.h"
template = "kernels.h.jinja"
shared_as = "galec-kernels.h.jinja"

[[files]]
path = "rumoca_galec_kernels.c"
template = "kernels.c.jinja"
shared_as = "galec-kernels.c.jinja"

[[files]]
path = "{{ model_name }}.h"
template = "model.h.jinja"
shared_as = "galec-model.h.jinja"

[[files]]
path = "{{ model_name }}.c"
template = "model.c.jinja"
shared_as = "galec-model.c.jinja"

# The formatter standard the emitted C already satisfies. It ships beside the
# sources so a downstream reformat cannot silently produce a different artifact
# than the one that was reviewed; `shared_as` lets the eFMU Production Code
# track emit the identical bytes.
[[files]]
path = ".clang-format"
template = "clang_format.jinja"
shared_as = "galec-clang-format.jinja"
