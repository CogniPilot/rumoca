version = 1
name = "efmu"
description = "Correlated eFMI container with checked Algorithm Code and its Solve-owned Production C/H refinement"
execution_mode = "packaged"
deployment_class = "efmi"
readiness_level = 0
completion_message = "Checked correlated eFMI development container written to: {{ out_dir }}"

[arithmetic]
source_real = "binary32"
source_integer = "i32"
real_matrix_multiply = "separate_mul_add_ascending_first_product"

[solve_executable.value_capabilities]
boolean_scalar = true
boolean_tensor = false
signed_integer_scalar = true
signed_integer_tensor = false
unsigned_integer_scalar = false
unsigned_integer_tensor = false
real_scalar = true
real_tensor = false
nested_record_arrays = false
empty_fields = false
empty_values = false
enum_brands = false
opaque_value_handles = false

[solve_executable.operation_effect_capabilities]
admitted = [
  "constant",
  "declaration-initialization",
  "error-signal-reset",
  "lifecycle-method",
  "store",
]

[solve_executable.environment]
environment = "freestanding"
allocation = "forbidden"
recursion = "forbidden"
max_automatic_payload_bytes = 65536
failure = "returned-status"
runtime_math = []
concurrency = "single-threaded"
atomics = "none"
admitted_library_contracts = []
isa_features = []

[solve_executable.emission]
kind = "loop"

[package]
root = "{{ model_name }}"
required_files = [
  "__content.xml",
  "AlgorithmCode/manifest.xml",
  "ProductionCode/manifest.xml",
  "schemas/VERSION.txt",
]

[[package.members]]
kind = "file"
file = "alg"

[[package.members]]
kind = "file"
file = "ac_manifest"

[[package.members]]
kind = "file"
file = "production_header"

[[package.members]]
