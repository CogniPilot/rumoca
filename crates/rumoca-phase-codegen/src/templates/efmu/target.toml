[package.archive]
path = "{{ model_name }}.efmu"
format = "zip"
root = "flat"

[capabilities]
scalar_fallback = true
continuous_states = false
residual_equations = false
external_functions = false
random = false
initialization = false
events = true
runtime_events = false
clocks = true
dynamic_ranges = false
dynamic_derivative_subscripts = false
forward_ad = false
reverse_ad = false
dynamic_control_flow = false
host_callbacks = false

# Both representations use the exact eFMI 1.0.0 Beta-1 schema release owned
# by `galec`.  `shared_from` lends the owner's embedded bytes; this target has
# no second vendored copy that could drift.
[[assets]]
source = "schemas"
shared_from = "galec"
dest = "schemas/"
product_role = "schema"

[[files]]
id = "alg"
artifact_kind = "algorithm-code"
semantic_context = "galec"
view = "algorithm-code-package"
product_role = "algorithm-code-source"
path = "AlgorithmCode/model.alg"
template = "model.alg.jinja"
template_shared_from = "galec"

[[files]]
id = "ac_manifest"
artifact_kind = "xml"
semantic_context = "galec"
view = "algorithm-code-package"
product_role = "algorithm-code-manifest"
path = "AlgorithmCode/manifest.xml"
template = "ac_manifest.xml.jinja"
required_artifact_identities = ["ac_manifest"]
  [[files.checksums]]
  of = "alg"
  algorithm = "sha1"
  as = "alg_sha1"

[[files]]
id = "production_header"
artifact_kind = "c-header"
semantic_context = "solve"
view = "solve-algorithm-block"
product_role = "production-header"
path = "ProductionCode/sources/production.h"
template = "production.h.jinja"

[[files]]
id = "production_source"
artifact_kind = "c-source"
semantic_context = "solve"
view = "solve-algorithm-block"
product_role = "production-source"
path = "ProductionCode/sources/production.c"
template = "production.c.jinja"

[[files]]
id = "pc_manifest"
artifact_kind = "xml"
semantic_context = "solve"
view = "solve-algorithm-block"
product_role = "production-manifest"
path = "ProductionCode/manifest.xml"
template = "pc_manifest.xml.jinja"
required_artifact_identities = ["ac_manifest", "pc_manifest"]
  [[files.checksums]]
  of = "ac_manifest"
  algorithm = "sha1"
  as = "ac_manifest_sha1"
  [[files.checksums]]
  of = "production_header"
  algorithm = "sha1"
  as = "production_header_sha1"
  [[files.checksums]]
  of = "production_source"
  algorithm = "sha1"
  as = "production_source_sha1"

[[files]]
id = "content"
artifact_kind = "xml"
semantic_context = "galec"
view = "algorithm-code-package"
product_role = "package-manifest"
path = "__content.xml"
template = "__content.xml.jinja"
required_artifact_identities = ["ac_manifest", "content", "pc_manifest"]
  [[files.checksums]]
  of = "ac_manifest"
  algorithm = "sha1"
  as = "ac_manifest_sha1"
  [[files.checksums]]
  of = "pc_manifest"
  algorithm = "sha1"
  as = "pc_manifest_sha1"
