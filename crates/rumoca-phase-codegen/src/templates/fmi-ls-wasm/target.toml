version = 1
name = "fmi-ls-wasm"
description = "Experimental FMI 3 Co-Simulation WebAssembly component using the pinned FMI-LS-Wasm WIT draft"
execution_mode = "compiled"
deployment_class = "wasm-component"
readiness_level = 0
completion_message = """Experimental FMI-LS-Wasm component crate written to: {{ out_dir }}
Build for wasm32-wasip2, then validate the component with wasm-tools.
Contract: modelica/fmi-ls-wasm@c1aac17d392bec989fe2d059db3cc57bb7a0fff5 (non-normative draft)."""

[package]
root = "{{ model_name }}"
required_files = ["Cargo.toml", "src/lib.rs", "src/model.rs", "wit/world.wit", "UPSTREAM.md", "upstream/LICENSE.txt"]

[[package.members]]
kind = "file"
file = "fmu"

[[package.members]]
kind = "file"
file = "library_source"

[[package.members]]
kind = "file"
file = "model_source"

[[package.members]]
kind = "file"
file = "upstream_notice"

[[package.members]]
kind = "asset"
source = "wit"
path = "fmi3-callbacks.wit"

[[package.members]]
kind = "asset"
source = "wit"
path = "fmi3-co-simulation.wit"

[[package.members]]
kind = "asset"
source = "wit"
path = "fmi3-common.wit"

[[package.members]]
kind = "asset"
source = "wit"
path = "fmi3-model-exchange.wit"

[[package.members]]
kind = "asset"
source = "wit"
path = "fmi3-scheduled-execution.wit"

[[package.members]]
kind = "asset"
source = "wit"
path = "fmi3-types.wit"

[[package.members]]
kind = "asset"
source = "wit"
path = "world.wit"

[[package.members]]
kind = "asset"
source = "upstream"
path = "LICENSE.txt"

[capabilities]
continuous_states = true
residual_equations = false
scalar_fallback = true
external_functions = false
random = false
initialization = false
events = false
runtime_events = false
clocks = false
dynamic_ranges = false
dynamic_derivative_subscripts = false
forward_ad = false
reverse_ad = false
dynamic_control_flow = false
host_callbacks = false

[capabilities.tensor]
matmul = "scalar"
linsolve = "scalar"
elementwise = "scalar"
stencil = "scalar"
reductions = "scalar"
layout = "row-major"
supports_dynamic_shapes = false
sparse = false
dtypes = ["f64"]

[[assets]]
source = "wit"
dest = "wit/"

[[assets]]
source = "upstream"
dest = "upstream/"

[[files]]
id = "fmu"
artifact_kind = "toml"
semantic_context = "solve"
view = "fmi-component"
path = "Cargo.toml"
template = "Cargo.toml.jinja"

[[files]]
id = "library_source"
artifact_kind = "rust-source"
semantic_context = "solve"
view = "fmi-component"
path = "src/lib.rs"
template = "lib.rs.jinja"
required_artifact_identities = ["fmu"]

[[files]]
id = "model_source"
artifact_kind = "rust-source"
semantic_context = "solve"
view = "fmi-component"
path = "src/model.rs"
template = "model.rs.jinja"

[[files]]
id = "upstream_notice"
artifact_kind = "markdown"
semantic_context = "solve"
view = "fmi-component"
path = "UPSTREAM.md"
template = "UPSTREAM.md.jinja"
