version = 1
ir = "fmi"
name = "fmi-ls-wasm"
description = "Experimental FMI 3 Co-Simulation WebAssembly component wrapping the shared FMI 3 C kernel behind the pinned FMI-LS-Wasm WIT draft"
execution_mode = "compiled"
deployment_class = "wasm-component"
readiness_level = 0
completion_message = """Experimental FMI-LS-Wasm component crate written to: {{ out_dir }}
The C sources under csrc/ are the shared FMI 3 kernel; src/lib.rs adapts the
pinned WIT world onto them. Build for wasm32-wasip2 with the standard
CC_wasm32_wasip2/AR_wasm32_wasip2 environment, then validate the component with
wasm-tools.
Contract: modelica/fmi-ls-wasm@c1aac17d392bec989fe2d059db3cc57bb7a0fff5 (non-normative draft)."""

[package]
root = "{{ model_name }}"
required_files = ["Cargo.toml", "build.rs", "src/lib.rs", "csrc/model.c", "csrc/model.h", "csrc/rmc_rows.c", "csrc/rmc_isolators.c", "csrc/rmc_functions.c", "csrc/rmc_assign.c", "csrc/rmc_jacobian.c", "csrc/fmi3Functions.h", "wit/world.wit", "UPSTREAM.md", "upstream/LICENSE.txt", "csrc/LICENSE.txt"]

[capabilities]
continuous_states = true
residual_equations = false
exact_algebraic_assignments = true
algebraic_projection = true
scalar_fallback = true
external_functions = false
external_tables = false
random = false
initialization = false
parameter_initialization = true
events = false
static_assertions = true
runtime_events = false
clocks = false
dynamic_ranges = false
dynamic_derivative_subscripts = false
forward_ad = false
reverse_ad = false
dynamic_control_flow = false
host_callbacks = false

[capabilities.tensor]
matmul = "scalar"
linsolve = "scalar"
elementwise = "scalar"
stencil = "scalar"
reductions = "scalar"
layout = "row-major"
supports_dynamic_shapes = false
sparse = false
dtypes = ["f64"]

[[assets]]
source = "wit"
dest = "wit/"

[[assets]]
source = "upstream"
dest = "upstream/"

[[assets]]
source = "fmi3-headers"
dest = "csrc/"

[[files]]
path = "Cargo.toml"
template = "Cargo.toml.jinja"
id = "fmu"

[[files]]
path = "build.rs"
template = "build.rs.jinja"

[[files]]
path = "src/lib.rs"
template = "lib.rs.jinja"

[[files]]
path = "csrc/model.c"
template = "model.c.jinja"

[[files]]
path = "csrc/model.h"
template = "model.h.jinja"

[[files]]
path = "csrc/rmc_rows.c"
template = "rmc_rows.c.jinja"

[[files]]
path = "csrc/rmc_isolators.c"
template = "rmc_isolators.c.jinja"

[[files]]
path = "csrc/rmc_functions.c"
template = "rmc_functions.c.jinja"

[[files]]
path = "csrc/rmc_assign.c"
template = "rmc_assign.c.jinja"

[[files]]
path = "csrc/rmc_jacobian.c"
template = "rmc_jacobian.c.jinja"

[[files]]
path = "UPSTREAM.md"
template = "UPSTREAM.md.jinja"
