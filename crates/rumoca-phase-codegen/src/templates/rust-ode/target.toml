version = 1
ir = "solve"
name = "rust-ode"
description = "Standalone Rust explicit-ODE right-hand-side evaluator from checked Solve IR"
execution_mode = "compiled"
deployment_class = "cpu"
readiness_level = 2
completion_message = """Rust ODE right-hand-side source written to: {{ out_dir }}
Compile: rustc --crate-type lib {{ out_dir }}/{{ model_name }}_ode.rs"""

[capabilities]
continuous_states = true
residual_equations = false
scalar_fallback = true
external_functions = false
external_tables = false
random = false
initialization = false
events = false
runtime_events = false
clocks = false
dynamic_ranges = false
dynamic_derivative_subscripts = false
forward_ad = false
reverse_ad = false
dynamic_control_flow = false
host_callbacks = false

[capabilities.tensor]
matmul = "scalar"
linsolve = "scalar"
layout = "row-major"
supports_dynamic_shapes = false
sparse = false
dtypes = ["f64"]

[[files]]
path = "{{ model_name }}_ode.rs"
template = "model_ode.rs.jinja"
