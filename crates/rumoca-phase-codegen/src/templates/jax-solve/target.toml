version = 1
ir = "solve"
name = "jax-solve"
description = "JAX explicit ODE rhs(t, x, u, p) from the solve IR"
execution_mode = "symbolic"
deployment_class = "symbolic"

[capabilities]
residual_equations = false
runtime_events = false

[[files]]
path = "{{ model_name }}_jax_solve.py"
template = "jax_solve.py.jinja"
