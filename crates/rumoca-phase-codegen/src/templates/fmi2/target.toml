version = 1
name = "fmi2"
description = "FMI 2.0.5 source-code ME+CS FMU over one checked tensor-native component"
execution_mode = "packaged"
deployment_class = "fmu"
readiness_level = 1
completion_message = """FMI 2 ME+CS source FMU written to: {{ out_dir }}
  {{ model_name }}/     unpacked source FMU
  {{ model_name }}.fmu  standards-valid flat FMU archive
Advertised profiles: FMI 2 Model Exchange and Co-Simulation."""

[package]
root = "{{ model_name }}"
required_files = ["modelDescription.xml", "sources/model.c"]

[[package.members]]
kind = "file"
file = "fmu"

[[package.members]]
kind = "file"
file = "model_source"

[package.archive]
path = "{{ model_name }}.fmu"
format = "zip"
root = "flat"

[capabilities]
continuous_states = true
residual_equations = false
scalar_fallback = true
external_functions = false
random = false
initialization = false
events = false
runtime_events = false
clocks = false
dynamic_ranges = false
dynamic_derivative_subscripts = false
forward_ad = false
reverse_ad = false
dynamic_control_flow = false
host_callbacks = false

[capabilities.tensor]
matmul = "scalar"
linsolve = "unsupported"
elementwise = "scalar"
stencil = "scalar"
reductions = "scalar"
layout = "row-major"
supports_dynamic_shapes = false
sparse = false
dtypes = ["f64"]

[[files]]
id = "fmu"
artifact_kind = "xml"
semantic_context = "solve"
view = "fmi-component"
path = "modelDescription.xml"
template = "modelDescription.xml.jinja"
required_artifact_identities = ["fmu"]

[[files]]
id = "model_source"
artifact_kind = "c-source"
semantic_context = "solve"
view = "fmi-component"
path = "sources/model.c"
template = "model.c.jinja"
required_artifact_identities = ["fmu"]
