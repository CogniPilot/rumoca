version = 1
ir = "solve"
name = "c-ode"
description = "Portable C11 explicit-ODE right-hand-side evaluator from checked Solve IR"
execution_mode = "compiled"
deployment_class = "cpu"
readiness_level = 2
completion_message = """C ODE right-hand-side sources written to: {{ out_dir }}
Compile: cc -O2 -Wall -c {{ out_dir }}/{{ model_name }}_ode.c"""

[capabilities]
continuous_states = true
residual_equations = false
scalar_fallback = true
external_functions = false
external_tables = false
random = false
initialization = false
events = false
runtime_events = false
clocks = false
dynamic_ranges = false
dynamic_derivative_subscripts = false
forward_ad = false
reverse_ad = false
dynamic_control_flow = false
host_callbacks = false

[capabilities.tensor]
matmul = "scalar"
linsolve = "scalar"
layout = "row-major"
supports_dynamic_shapes = false
sparse = false
dtypes = ["f64"]

[[files]]
path = "{{ model_name }}_ode.h"
template = "model_ode.h.jinja"

[[files]]
path = "{{ model_name }}_ode.c"
template = "model_ode.c.jinja"
