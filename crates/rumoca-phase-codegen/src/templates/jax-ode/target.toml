version = 1
ir = "solve"
name = "jax-ode"
description = "JAX explicit ODE rhs(t, x, u, p) from the solve IR"
readiness_level = 1
execution_mode = "symbolic"
deployment_class = "symbolic"

[capabilities]
continuous_states = true
residual_equations = false
scalar_fallback = true
external_functions = false
external_tables = false
random = false
initialization = false
events = false
runtime_events = false
clocks = false
dynamic_ranges = false
dynamic_derivative_subscripts = false
forward_ad = true
reverse_ad = true
dynamic_control_flow = false
host_callbacks = false

[capabilities.tensor]
matmul = "scalar"
linsolve = "scalar"
elementwise = "scalar"
stencil = "scalar"
reductions = "scalar"
layout = "row-major"
supports_dynamic_shapes = false
sparse = false
dtypes = ["f64"]

[[files]]
path = "{{ model_name }}_jax_ode.py"
template = "jax_ode.py.jinja"
