[package]
name = "rumoca-phase-codegen"
description = "Template-based code generation phase for the Rumoca compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
indexmap = { workspace = true }
minijinja = { workspace = true }
miette = { workspace = true }
rumoca-core = { workspace = true }
rumoca-eval-solve = { workspace = true }
rumoca-ir-ast = { workspace = true }
rumoca-ir-dae = { workspace = true }
rumoca-ir-flat = { workspace = true }
rumoca-ir-galec = { workspace = true }
rumoca-ir-solve = { workspace = true }
rumoca-eval-dae = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
naga = { version = "27", features = ["wgsl-in"] }
tempfile = { workspace = true }
rumoca-phase-solve = { workspace = true }
# SPEC_0039 / SOLVE-C17: pattern fixtures are a test-only surface. Declaring
# the feature here and nowhere else keeps it out of every production build of
# this crate.
rumoca-ir-solve = { workspace = true, features = ["pattern-fixtures"] }
