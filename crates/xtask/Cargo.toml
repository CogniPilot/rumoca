[package]
name = "xtask"
description = "Cross-platform developer tooling for rumoca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[[bin]]
name = "rumoca-traversal-policy-check"
path = "src/bin/rumoca-traversal-policy-check.rs"

# xtask carries NO `rumoca-*` workspace dependency: it parses args, moves files,
# and shells out. Compiler-linked work runs on demand through commands in the
# owning package. The CI arch check enforces this boundary.
[dependencies]
anyhow = { workspace = true }
rustc-demangle = "0.1"
clap = { workspace = true }
clap_complete = { workspace = true }
mimalloc = { workspace = true }
num_cpus = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
blake3 = { workspace = true }
quick-xml = { workspace = true }
sha1 = { workspace = true }
sha2 = "0.10"
toml = { workspace = true }
lsp-types = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
ureq = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
flate2 = { workspace = true }
tar = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[lints]
workspace = true
