version = 1
ir = "solve"
name = "in-process-cranelift"

[specialization]
schema_version = 2
name = "in-process-cranelift"
layout = "dense-host-v1"
max_unrolled_passes = 32
max_unrolled_operations = 1024
admits_nested_map_frames = false
# Most root operations in one issued call partition (positive). Regions stay
# atomic and each partition keeps one root frame; this bounds neither expanded
# instructions nor frame bytes.
max_call_partition_operations = 256
# Most bytes of simultaneously live register values kept in non-memory locals
# (positive). Values beyond it go to explicit workspace cells. A register costs
# scalar count x element size: binary64 and Integer 8, binary32 4, Boolean 8.
local_budget_bytes = 1048576
