[package]
name = "rumoca-bind-wasm"
description = "WebAssembly bindings for Rumoca compile and optional simulation surfaces"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-opt settings used when building published packages (build.mjs --optimize,
# which drops the default --no-opt). -Oz optimizes for size; the thread/bulk-
# memory features keep the wasm-rayon variants valid. -g keeps the WASM `name`
# custom section, so a function index in a browser profile or a trap stack maps
# to its Rust symbol.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz', '-g', '--enable-threads', '--enable-bulk-memory']

[dependencies]
rumoca-compile = { workspace = true }
rumoca-core = { workspace = true }
rumoca-exec-wasm = { workspace = true, optional = true }
rumoca-ir-solve = { workspace = true }
sha2 = { version = "0.10", optional = true }
rumoca-eval-ast = { workspace = true }
rumoca-phase-galec = { workspace = true }
rumoca-sim = { workspace = true, default-features = false, optional = true }
rumoca-tool-lint = { workspace = true }
# default-features = false drops the `server`+`simulation` features and keeps
# light builds on completions/diagnostics/helpers only.
rumoca-tool-lsp = { workspace = true, default-features = false }
anyhow = { workspace = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
indexmap = { workspace = true }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
lsp-types = { workspace = true }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen-rayon = { version = "1.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rumoca-eval-solve = { workspace = true }
flate2 = { workspace = true }
wasmi = { version = "0.46", default-features = false, features = ["std"] }

[features]
default = ["console_error_panic_hook"]
# The full web build is the browser-safe simulation build: explicit rk45 only.
# Diffsol must NOT be added here — it pulls the Pulp relaxed-SIMD graph, which
# is not safe in all browsers (guarded by
# architecture_hardening_test::test_bind_wasm_full_web_uses_browser_safe_solver_graph).
full-web = ["sim-rk45", "native-assignments"]
# Stateless CPU kernels use checked lowering through the optional runtime facade.
# Enabling this surface does not enable an ODE solver.
native-assignments = ["dep:rumoca-sim", "dep:rumoca-exec-wasm", "dep:sha2"]
sim-wasm = ["dep:rumoca-sim", "rumoca-sim/wasm-solvers"]
sim-diffsol = ["dep:rumoca-sim", "rumoca-sim/solver-diffsol"]
sim-rk45 = ["dep:rumoca-sim", "rumoca-sim/solver-rk45"]
wasm-rayon = ["dep:wasm-bindgen-rayon"]

[lints]
workspace = true
