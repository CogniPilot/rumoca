[package]
name = "rumoca"
description = "Modelica compiler written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["modelica", "compiler", "dae", "simulation"]
categories = ["compilers", "science", "simulation"]
default-run = "rumoca"
# Integration tests are declared explicitly below instead of being auto-
# discovered from `tests/*.rs`. Every `[[test]]` target statically links the
# whole compiler, so one target per file made linking — not codegen — the
# dominant memory and disk cost of `cargo test -p rumoca`, and parallel links
# spiked peak RSS hard enough to trip the OOM killer. Each `tests/suite_*.rs`
# root owns normal modules in its matching directory, leaving one binary per
# required-feature set. See `tests/suite_core/main.rs` for placement rules.
autotests = false

[[bin]]
name = "rumoca"
path = "src/main.rs"
required-features = [
    "scheduled-sim",
    "scenario-config",
    "input-keyboard",
    "transport-udp",
    "transport-zenoh",
    "viewer-web",
    "process-control",
]

[features]
default = [
    "scheduled-sim",
    "scenario-config",
    "input-keyboard",
    "input-gamepad",
    "transport-udp",
    "transport-zenoh",
    "viewer-web",
    "process-control",
    "native-allocator",
    "fmu-packaging",
]
scheduled-sim = ["rumoca-sim/scheduled-sim"]
scenario-config = ["rumoca-sim/scenario-config"]
input-keyboard = ["rumoca-sim/input-keyboard"]
input-gamepad = ["rumoca-sim/input-gamepad"]
transport-udp = ["rumoca-sim/transport-udp"]
transport-zenoh = ["rumoca-sim/transport-zenoh"]
viewer-web = ["rumoca-sim/viewer-web"]
process-control = ["rumoca-sim/process-control"]
native-allocator = ["dep:mimalloc"]
fmi = ["rumoca-sim/fmi"]
fmu-packaging = ["fmi", "rumoca-compile/fmu-packaging"]
examples-smoke-tests = []
msl-sim-tests = []
# Opt-in RDD2 metric gate inside `suite_gates` (`tests/rdd2_perf_guard.rs`). It
# drives the RELEASE binary as a subprocess and needs the out-of-tree
# `modelica_models` library, so it cannot
# run in a default `cargo test`; a feature is how this repo gates heavy suites
# (`#[ignore]` is banned by `architecture_hardening_test`). They still link no
# `rumoca` library, so they stay in `suite_gates` rather than earning a
# `[[test]]` target of their own.
rdd2-metric-gates = []
template-runtime-tests = []
# Heavy Solve-lowering regressions that grind for minutes until the compact
# Solve function-fold owner lands (SPEC 0036 checklist); see
# `tests/suite_heavy_solve/main.rs`.
heavy-solve-tests = []
tracing = ["dep:tracing-subscriber", "rumoca-compile/tracing"]

[dependencies]
# Internal crates: CLI consumes high-level facades plus the phase-owned
# ResolvedTree proof exposed by its library API.
# rumoca-compile wraps all compilation phases.
# rumoca-sim wraps simulation primitives, solvers, and opt-in axes for scenario
# config, scheduling, transports, input devices, viewer web UI, and reports.
# Library consumers select only the axes they need.
rumoca-compile = { workspace = true }
rumoca-core = { workspace = true }
rumoca-phase-resolve = { workspace = true }
rumoca-sim = { workspace = true, default-features = false, features = ["native-solvers"] }
rumoca-tool-fmt = { workspace = true }
rumoca-tool-lint = { workspace = true }

# External dependencies
anyhow = { workspace = true }
# Binary-only global allocator; gated behind `native-allocator` (see [features]).
mimalloc = { workspace = true, optional = true }
clap = { workspace = true }
clap_complete = { workspace = true }
getrandom = { workspace = true }
miette = { workspace = true }
minijinja = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }
time = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
walkdir = { workspace = true }
uuid = { workspace = true }
# Reset SIGPIPE to its default disposition so piping into `head` exits cleanly
# instead of panicking on a broken-pipe write. Encapsulates the one unsafe libc
# call so this crate keeps `unsafe_code = "deny"`.
sigpipe = { workspace = true }

[[example]]
name = "simulation_session_demo"
path = "examples/simulation_session_demo.rs"

[[example]]
name = "quadrotor_sil"
path = "examples/quadrotor_sil.rs"

# The repo-wide architecture gate. Kept a target of its own because people
# rerun it by name (`cargo test -p rumoca --test architecture_hardening_test`)
# and because it is the one suite whose failure must be readable on its own.
[[test]]
name = "architecture_hardening_test"
path = "tests/architecture_hardening_test/main.rs"

# Repo-inspection policy/budget gates. Deliberately separate from `suite_core`:
# these link no `rumoca` library, so `cargo xtask verify quick` runs them
# without paying for a whole-compiler link.
[[test]]
name = "suite_gates"
path = "tests/suite_gates/main.rs"

# Every remaining test file that needs no features beyond the crate defaults.
[[test]]
name = "suite_core"
path = "tests/suite_core/main.rs"

# `tests/suite_examples_smoke/examples_smoke.rs`.
[[test]]
name = "suite_examples_smoke"
path = "tests/suite_examples_smoke/main.rs"
required-features = ["examples-smoke-tests"]

# Runtime modules under `tests/suite_template_runtime/`.
[[test]]
name = "suite_template_runtime"
path = "tests/suite_template_runtime/main.rs"
required-features = ["template-runtime-tests"]

# `tests/suite_msl_sim/msl_sim_regression.rs`.
[[test]]
name = "suite_msl_sim"
path = "tests/suite_msl_sim/main.rs"
required-features = ["msl-sim-tests"]

# `tests/suite_heavy_solve/quadrotor_se23_regression_test.rs`: heavy Solve-lowering guards that
# run for minutes until compact function folds land; see
# `tests/suite_heavy_solve/main.rs`.
[[test]]
name = "suite_heavy_solve"
path = "tests/suite_heavy_solve/main.rs"
required-features = ["heavy-solve-tests"]

# GALEC-family modules share this owner. Feature-independent checks compile
# without defaults; container/zip modules are internally `cfg`-gated by
# `fmu-packaging`.
[[test]]
name = "suite_galec_fmu"
path = "tests/suite_galec_fmu/main.rs"

[dev-dependencies]
blake3 = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }
crossterm = { workspace = true }
tungstenite = { workspace = true }
mimalloc = { workspace = true }
walkdir = { workspace = true }
serde = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
# Direct phase access for debugging/analysis tests
rumoca-ir-ast = { workspace = true }
rumoca-ir-flat = { workspace = true }
rumoca-ir-dae = { workspace = true }
rumoca-ir-galec = { workspace = true }
rumoca-ir-solve = { workspace = true }
rumoca-phase-flatten = { workspace = true }
rumoca-phase-instantiate = { workspace = true }
rumoca-phase-parse = { workspace = true }
rumoca-phase-codegen = { workspace = true }
rumoca-phase-dae = { workspace = true }
rumoca-phase-galec = { workspace = true }
# The Jacobian admission table is the data the battery is generated from
# (`tests/suite_core/jacobian_admission_battery.rs`), so the gate reads the
# rules from the crate that owns them rather than restating them where they
# could drift.
rumoca-phase-autodiff = { workspace = true }
rumoca-eval-solve = { workspace = true }
# Native side of the interpreter-versus-JIT differential oracle
# (`tests/suite_core/backend_executor_differential.rs`). `rumoca-sim` already
# links this crate unconditionally off wasm, so the edge adds no link cost; the
# test needs the compile entry point by name to drive both executors over one
# block.
rumoca-exec-cranelift = { workspace = true }
# SPEC_0034 GAL-027/GAL-038 independence oracle.
# The eFMI suite consumes it to interpret the checked AlgorithmCodePackage and
# validate Algorithm Code independently of lowering. Test-only on purpose —
# the oracle must stay free of lowering/codegen dependencies, so no shipped
# crate may depend on it.
rumoca-eval-galec = { workspace = true }
rumoca-phase-parse-galec = { workspace = true }
# Runtime state machine + backend-neutral simulation driver (SPEC_0029 §3b);
# the AD/sensitivity integration tests drive `SolveRuntime` directly.
rumoca-solver = { workspace = true }
rumoca-phase-solve = { workspace = true }
rumoca-phase-typecheck = { workspace = true }
# SPEC_0036 callable-plan boundary: the architecture suite asks the compiler,
# not a parser, whether the plan root can be cloned, defaulted, or serialized.
rumoca-plan-callable = { workspace = true }
# GALEC target CI (tests only): independently recompute the SHA-1 checksum web,
# inspect ZIP members, and check XML well-formedness / attribute order over the
# exact on-disk bytes. Production packaging is owned by `rumoca-compile`.
quick-xml = { workspace = true }

[lints]
workspace = true
