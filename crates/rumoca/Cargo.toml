[package]
name = "rumoca"
description = "Modelica compiler written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["modelica", "compiler", "dae", "simulation"]
categories = ["compilers", "science", "simulation"]
default-run = "rumoca"
# Integration tests are declared explicitly below instead of being auto-
# discovered from `tests/*.rs`. Every `[[test]]` target statically links the
# whole compiler, so one target per file made linking — not codegen — the
# dominant memory and disk cost of `cargo test -p rumoca`, and parallel links
# spiked peak RSS hard enough to trip the OOM killer. The test files stay
# exactly where they are; `tests/suite_*.rs` pull them in as `#[path]` modules
# so there is one binary per required-feature set. See `tests/suite_core.rs`
# for the rules on where a new test file goes.
autotests = false

[[bin]]
name = "rumoca"
path = "src/main.rs"
required-features = [
    "scheduled-sim",
    "scenario-config",
    "input-keyboard",
    "transport-udp",
    "transport-zenoh",
    "viewer-web",
    "process-control",
]

[features]
default = [
    "scheduled-sim",
    "scenario-config",
    "input-keyboard",
    "input-gamepad",
    "transport-udp",
    "transport-zenoh",
    "viewer-web",
    "process-control",
    "native-allocator",
    "fmu-packaging",
]
scheduled-sim = ["rumoca-sim/scheduled-sim"]
scenario-config = ["rumoca-sim/scenario-config"]
input-keyboard = ["rumoca-sim/input-keyboard"]
input-gamepad = ["rumoca-sim/input-gamepad"]
transport-udp = ["rumoca-sim/transport-udp"]
transport-zenoh = ["rumoca-sim/transport-zenoh"]
viewer-web = ["rumoca-sim/viewer-web"]
process-control = ["rumoca-sim/process-control"]
native-allocator = ["dep:mimalloc"]
fmu-packaging = ["dep:zip"]
examples-smoke-tests = []
msl-sim-tests = []
template-runtime-tests = []
tracing = ["dep:tracing", "dep:tracing-subscriber", "rumoca-compile/tracing"]

[dependencies]
# Internal crates: CLI consumes high-level facades plus the phase-owned
# ResolvedTree proof exposed by its library API.
# rumoca-compile wraps all compilation phases.
# rumoca-sim wraps simulation primitives, solvers, and opt-in axes for scenario
# config, scheduling, transports, input devices, viewer web UI, and reports.
# Library consumers select only the axes they need.
rumoca-compile = { workspace = true }
rumoca-core = { workspace = true }
rumoca-ir-solve = { workspace = true }
rumoca-ir-galec = { workspace = true }
rumoca-phase-codegen = { workspace = true }
rumoca-phase-galec = { workspace = true }
rumoca-phase-resolve = { workspace = true }
rumoca-sim = { workspace = true, default-features = false, features = ["native-solvers"] }
rumoca-tool-fmt = { workspace = true }
rumoca-tool-lint = { workspace = true }

# External dependencies
anyhow = { workspace = true }
# Binary-only global allocator; gated behind `native-allocator` (see [features]).
mimalloc = { workspace = true, optional = true }
clap = { workspace = true }
clap_complete = { workspace = true }
miette = { workspace = true }
minijinja = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }
sha1 = { workspace = true }
time = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
walkdir = { workspace = true }
uuid = { workspace = true }
# Used only by FMU packaging (FMU export = zip archive); pulls C compression
# backends (bzip2/lzma/zstd), so gate behind `fmu-packaging`.
zip = { workspace = true, optional = true }
# Reset SIGPIPE to its default disposition so piping into `head` exits cleanly
# instead of panicking on a broken-pipe write. Encapsulates the one unsafe libc
# call so this crate keeps `unsafe_code = "deny"`.
sigpipe = { workspace = true }

[[example]]
name = "simulation_session_demo"
path = "examples/simulation_session_demo.rs"

[[example]]
name = "quadrotor_sil"
path = "examples/quadrotor_sil.rs"

# The repo-wide architecture gate. Kept a target of its own because people
# rerun it by name (`cargo test -p rumoca --test architecture_hardening_test`)
# and because it is the one suite whose failure must be readable on its own.
[[test]]
name = "architecture_hardening_test"
path = "tests/architecture_hardening_test.rs"

# Repo-inspection policy/budget gates. Deliberately separate from `suite_core`:
# these link no `rumoca` library, so `cargo xtask verify quick` runs them
# without paying for a whole-compiler link.
[[test]]
name = "suite_gates"
path = "tests/suite_gates.rs"

# Every remaining test file that needs no features beyond the crate defaults.
[[test]]
name = "suite_core"
path = "tests/suite_core.rs"

# `tests/examples_smoke.rs`.
[[test]]
name = "suite_examples_smoke"
path = "tests/suite_examples_smoke.rs"
required-features = ["examples-smoke-tests"]

# `tests/template_target_ci.rs`, `tests/codegen_example_regression.rs`,
# `tests/backend_template_runtime_regression.rs`.
[[test]]
name = "suite_template_runtime"
path = "tests/suite_template_runtime.rs"
required-features = ["template-runtime-tests"]

# `tests/msl_sim_regression.rs`.
[[test]]
name = "suite_msl_sim"
path = "tests/suite_msl_sim.rs"
required-features = ["msl-sim-tests"]

# `tests/cli_target_galec.rs` and `tests/cli_target_galec_production.rs`:
# they exercise generic target-declared packaging end-to-end and inspect the
# target-declared zip archive via the optional `zip` dependency, so they must
# not compile under --no-default-features.
[[test]]
name = "suite_galec_fmu"
path = "tests/suite_galec_fmu.rs"
required-features = ["fmu-packaging"]

[dev-dependencies]
crossterm = "0.28"
indexmap = { workspace = true }
tungstenite = "0.26"
mimalloc = { workspace = true }
# MSL test dependencies
flate2 = "1.0"
tar = "0.4"
walkdir = "2.5"
ureq = "2.9"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
ntest = "0.9"  # Test timeouts
# Direct phase access for debugging/analysis tests
rumoca-ir-ast = { workspace = true }
rumoca-ir-flat = { workspace = true }
rumoca-ir-dae = { workspace = true }
rumoca-phase-flatten = { workspace = true }
rumoca-phase-instantiate = { workspace = true }
rumoca-phase-parse = { workspace = true }
rumoca-phase-codegen = { workspace = true }
rumoca-phase-dae = { workspace = true }
rumoca-eval-solve = { workspace = true }
# Runtime state machine + backend-neutral simulation driver (SPEC_0029 §3b);
# the AD/sensitivity integration tests drive `SolveRuntime` directly.
rumoca-solver = { workspace = true }
rumoca-phase-solve = { workspace = true }
rumoca-phase-typecheck = { workspace = true }
# GALEC target CI (tests only): recompute the SHA-1 checksum web and check
# manifest.xml well-formedness / attribute order over the exact on-disk bytes.
# xmllint XSD validation runs the external `xmllint`; the SHA-1 primitive comes
# through the `rumoca-compile` facade.
quick-xml = { workspace = true }

[lints]
workspace = true
