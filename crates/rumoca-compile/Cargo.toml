[package]
name = "rumoca-compile"
description = "Multi-file Modelica compilation pipeline for Rumoca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
fmu-packaging = ["dep:zip"]
tracing = [
    "rumoca-phase-flatten/tracing",
    "rumoca-phase-instantiate/tracing",
    "rumoca-phase-resolve/tracing",
    "rumoca-phase-structural/tracing",
]

[dependencies]
rumoca-ir-ast = { workspace = true }
rumoca-ir-flat = { workspace = true }
rumoca-ir-dae = { workspace = true }
rumoca-ir-solve = { workspace = true }
rumoca-phase-autodiff = { workspace = true }
rumoca-phase-parse = { workspace = true }
rumoca-phase-resolve = { workspace = true }
rumoca-phase-typecheck = { workspace = true }
rumoca-phase-instantiate = { workspace = true }
rumoca-phase-flatten = { workspace = true }
rumoca-phase-dae = { workspace = true }
rumoca-phase-structural = { workspace = true }
rumoca-phase-codegen = { workspace = true }
rumoca-phase-galec = { workspace = true }
rumoca-phase-solve = { workspace = true }
rumoca-ir-galec = { workspace = true }
rumoca-core = { workspace = true }
anyhow = { workspace = true }
indexmap = { workspace = true }
minijinja = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }
bincode = { workspace = true }
flate2 = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
