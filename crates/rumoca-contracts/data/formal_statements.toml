status = 'RecordedDivergence'

[[statements]]
id = 'FS-SIM-007'
statement = 'The initialization system is simultaneous over every equation of the model at once, so an initialization row that reads an algebraic variable determines that variable together with the states: `a = 2*time + 5; der(x) = a - x;` with `initial equation der(x) = 0` initializes x to 5.'
tier = 'SpecSourced'
edition = '3.6'
section = '§8.6'
quote_kind = 'Verbatim'
quote = 'The initialization uses all equations and algorithms that are utilized in the intended operation.'
quote_source = 'crates/rumoca-phase-solve/src/lower/initial_projection.rs'
pin_kind = 'Test'
pin_file = 'crates/rumoca-sim/src/solve_lowering/tests.rs'
pin_anchor = 'an_algebraic_reading_initialization_row_is_checked_against_a_stale_seed'
pin_polarity = 'PinsDivergence'
status = 'RecordedDivergence'
related_sections = ['§8.6']
note = 'This is a §8.6 violation, not a latitude: der(...) and the pre-variables are interpreted as unknown algebraic variables and the whole equation set is solved at once, so x(0) = 5 is required rather than chosen. rumoca evaluates initialization residuals before settling the algebraics, so an algebraic still holds the number its start seeded; here the seeds cancel, the check passes, and the stated initial condition vanishes silently at x(0) = 0. A typed refusal was implemented and measured on the 19 MSL models that both compile through Solve and carry an initial section; it fires on 5, two of which simulate today, so it was not landed. The owner that makes the shape right is the algebraic refresh joining the initialization solve.'

[[statements]]
id = 'FS-SIM-008'
statement = 'An initialization system whose rows read a discrete coordinate may still be solvable, so `x + q = 5; x = d + 2;` with `d(start = 0, fixed = true)` is determined at x = 2, q = 3.'
tier = 'OracleImplied'
oracle = 'OpenModelica (omc)'
evidence = 'crates/rumoca-phase-solve/src/lower/initial_projection.rs — the module header, under discrete reads'
latitude_note = 'The discrete coordinate is at its §8.6 value when the residual runs, so the row checks a real number; rumoca simply has no way to solve for the state it also reads and reports EX001. That is an over-refusal against omc, not merely an unplanned row.'
pin_kind = 'Record'
pin_file = 'crates/rumoca-phase-solve/src/lower/initial_projection.rs'
pin_anchor = 'That is an over-refusal against OMC'
pin_polarity = 'PinsDivergence'
status = 'RecordedDivergence'

[[statements]]
id = 'FS-SIM-009'
statement = 'A self-rescheduling when guard whose threshold is already met at the start instant has no rising edge there, so it never fires, never re-arms, and its accumulator holds its start value for the whole run.'
