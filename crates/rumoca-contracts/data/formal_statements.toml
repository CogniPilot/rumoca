evidence = 'crates/rumoca/tests/time_event_when_activation.rs — the divergence list in the module header'
latitude_note = 'MLS §8.6 names two enabling spellings; that a condition merely containing initial() is therefore not enabled is read off omc, which enables neither `when initial() or time > 0.5` nor `when not initial()`. rumoca treats any condition containing initial() as enabling. The vector spelling is correct; the scalar one is a separate §8.6 admissibility question and no test asserts it.'
pin_kind = 'Record'
pin_file = 'crates/rumoca/tests/time_event_when_activation.rs'
pin_anchor = 'A scalar `initial()` inside a larger condition enables the whole'
pin_polarity = 'PinsDivergence'
status = 'RecordedDivergence'

