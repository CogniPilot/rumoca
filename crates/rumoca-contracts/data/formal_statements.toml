# Formal-statement registry — which formal statement justifies each pinned
# behavior, and whether it is spec-normative or oracle-implied.
#
# Hand written. Nothing generates this table: the classification each row makes
# is a judgment, and a generator would launder it. See
# `src/registry/formal.rs` for the schema, the tiers, and the rules
# `tests/formal_statement_invariants.rs` enforces over every row.
#
# Field summary:
#   id                 FS-<CATEGORY>-<NNN>, category from SPEC_0022
#   statement          the formal statement, one precise sentence
#   tier               SpecSourced | OracleImplied
#   edition/section    SpecSourced: the MLS edition and section
#   quote_kind/quote   SpecSourced: Verbatim MLS text, or the tree's Paraphrase
#   quote_source       SpecSourced: the file where `quote` already appears
#   oracle/evidence    OracleImplied: the oracle, and where its evidence is
#   latitude_note      OracleImplied: what the specification leaves open
#   pin_kind           Test | Site | Record
#   pin_file/pin_anchor  the file, and the exact text that must occur in it
#   status             Enforced | RecordedDivergence | Unimplemented

