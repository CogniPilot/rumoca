[[statements]]
id = 'FS-FUNC-006'
statement = 'A multi-result call is evaluated once and its results are then assigned, so reading each result as its own invocation is observationally equal to that single evaluation only for a callee whose results depend on nothing but its arguments.'
tier = 'SpecSourced'
edition = '3.6'
section = '§12.4.3'
quote_kind = 'Paraphrase'
quote = 'MLS §12.4.3 evaluates a multi-result call once'
quote_source = 'crates/rumoca-phase-dae/src/construction/analysis/function_bodies.rs'
pin_kind = 'Test'
pin_file = 'crates/rumoca-phase-dae/src/construction/tests/multi_output_calls.rs'
pin_anchor = 'multi_result_call_to_an_impure_external_callee_is_rejected_by_name'
pin_polarity = 'Asserts'
status = 'Enforced'
related_sections = ['§12.3', '§11.2.1.1']
note = 'The canonical DAE owns no multi-result node: it owns one call(function, ordinal, ..) per result read, so a statement reading k results denotes k invocations. Rather than diverge silently, an impure external callee is refused by name. What makes body_is_pure the exact predicate is the §12.3 rule of FS-FUNC-001 — a bare external is treated as impure — but the statement being protected here is the §12.4.3 single evaluation, which is why this row cites §12.4.3 and lists §12.3 beside it. A shared multi-result node would remove both the refusal and the cost.'

[[statements]]
id = 'FS-FUNC-007'
statement = 'A function partial application denotes a partially evaluated function, which is itself a function value and not an array of scalars.'
tier = 'SpecSourced'
edition = '3.6'
section = '§12.4.2.1'
quote_kind = 'Verbatim'
quote = 'returns a partially evaluated function that is also a function, with the remaining not bound formal parameters still present in the same order as in the original function declaration'
quote_source = 'crates/rumoca-phase-dae/src/construction/function_shapes.rs'
pin_kind = 'Test'
pin_file = 'crates/rumoca-phase-dae/src/construction/tests/multi_output_calls.rs'
pin_anchor = 'function_partial_application_is_rejected_by_name'
pin_polarity = 'PinsDivergence'
status = 'Unimplemented'
contracts = ['FUNC-033']
note = 'Flat carries no marker distinguishing the form from an under-applied call, so the shape prover would otherwise report an arity mismatch and point a reader at the callee declaration instead of at the unimplemented feature. The signature Flat does preserve is exact: every argument a retained named-argument wrapper, and fewer arguments than the callee declares.'

