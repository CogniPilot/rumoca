[[statements]]
id = 'FS-EQN-016'
statement = 'Two branches of one when/elsewhen chain whose instants coincide are resolved in one event iteration, so branch priority decides and the first branch assignment stands for the rest of the run.'
tier = 'SpecSourced'
edition = '3.6'
section = '§8.3.5.1'
quote_kind = 'Paraphrase'
quote = '§8.3.5.1 spells the chain out as one if-expression per assigned variable whose arms are `edge(b1)`, `edge(b2)`, … over one `Boolean bi` per branch condition'
quote_source = 'crates/rumoca-phase-dae/src/construction/model_events.rs'
pin_kind = 'Record'
pin_file = 'crates/rumoca/tests/time_event_when_activation.rs'
pin_anchor = 'REGRESSION INTRODUCED HERE'
pin_polarity = 'PinsDivergence'
status = 'RecordedDivergence'
related_sections = ['§8.3.5', '§8.3.5.4']
note = 'A violation rather than a latitude: §8.3.5.1 gives each assigned variable ONE if-elseif expression whose arms are the branch edges, and one equation cannot be evaluated across two event iterations, so splitting the chain is not a scheduling freedom. §8.3.5.4 then supplies the resolution FS-EQN-009 carries. rumoca gives the first branch a scheduled instant and the second a located crossing, which land in different iterations, so the second branch finds its own edge where the first no longer has one: y regressed from 1 to 2 relative to the pre-change tree on this shape. Before the branch guards were corrected the level subtraction masked it. The diffsol session leaves y = 0 here, before and after.'

[[statements]]
id = 'FS-EQN-017'
statement = 'A scalar initial() occurring inside a larger activation condition does not enable the when-clause during initialization; §8.6 enables exactly the spellings when initial() then and when {..., initial(), ...} then.'
