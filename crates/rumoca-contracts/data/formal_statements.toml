[[statements]]
id = 'FS-EQN-011'
statement = 'A when body expands to simultaneous equations, one v = if edge(b) then expr else pre(v) per assigned variable, so a body that reads a variable it also assigns must observe the newly assigned value.'
tier = 'SpecSourced'
edition = '3.6'
section = '§8.3.5.1'
quote_kind = 'Verbatim'
quote = 'Boolean b(start = x.start > 2); b = x > 2; v1 = if edge(b) then expr1 else pre(v1);'
quote_source = 'crates/rumoca/tests/time_event_when_activation.rs'
pin_kind = 'Record'
pin_file = 'crates/rumoca/tests/time_event_when_activation.rs'
pin_anchor = 'A `when` body reading a variable the same body assigns — SPEC VIOLATION'
pin_polarity = 'PinsDivergence'
status = 'RecordedDivergence'
note = 'rumoca evaluates the rows of an event pass sequentially against the event-entry snapshot, so it sees the old value: omc gives b = 100 and rumoca gives b = -100 on both solver sessions. This is the whole of what separates rumoca from omc on the *shape* of Modelica.Blocks.Math.ContinuousSignalExtrema, whose t_min/t_max read y_min after the same body assigns it — the model itself does not compile in rumoca today (initial() inside an expression and terminal(), ED018; pre of a continuous variable, ED019), so no claim is made about its measured behavior. The claim is measured on reductions of the shape.'

