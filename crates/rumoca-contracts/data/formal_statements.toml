pin_anchor = 'the MLS supplies no rule'
pin_polarity = 'PinsDivergence'
status = 'Unimplemented'
note = 'A per-node property, not a per-model one: ParallelPumpDropOut and TwoMass each join three FlowPorts at a node and also carry ordinary two-port nodes whose rows this owner does chain and rewrite.'

[[statements]]
id = 'FS-EXPR-008'
statement = 'Which end of a semiLinear chain the surviving positive slope comes from is not determined; the two orientations differ only in the value at exactly x == 0 and both satisfy Rule 1.'
tier = 'SpecSilent'
rationale = 'MLS §3.7.4.5 states Rule 1 as a rewrite over a chain without naming which endpoint sa is, and the section supplies the identity that makes the two orientations interchangeable — semiLinear(m_flow, port_h, h) is identical to -semiLinear(-m_flow, h, port_h) — so reversing the orientation maps the chain onto itself with sa and sb exchanged. The silence is therefore established by the rule and its own identity, not assumed from the section being quiet: the specification says the two are the same equation, and says nothing that separates them at x == 0.'
alternatives_considered = 'rumoca fixes the orientation from the model itself: sa is the endpoint whose slope class roots on the earlier-declared variable, which on the FluidHeatFlow models is the upstream-in-forward-flow end. The alternative of calibrating against another tool was tried and abandoned. What stays unpinned is a chain endpoint whose slope class holds two variables proven equal: that class roots on whichever the union merged first, and the tie-break can name the opposite end. No FluidHeatFlow node proves two slopes equal.'
oracle_consulted = 'OpenModelica (omc) — rejected as an anchor: its selection at x == 0 is itself a function of the operand order its connection balances were emitted in, so it does not answer the question and cannot be calibrated against.'
pin_kind = 'Site'
