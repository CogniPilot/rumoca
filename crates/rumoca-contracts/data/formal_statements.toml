[[statements]]
id = 'FS-EQN-015'
statement = 'A scheduled time-event instant and a state crossing that land on the same instant belong to one event iteration, so an activation that reads pre(a) at that instant reads the value a held before the iteration.'
tier = 'SpecSourced'
edition = '3.6'
section = '§8.5'
quote_kind = 'Verbatim'
quote = 'An event generating expression has an internal buffer, and the value of the expression can only be changed at event instants'
quote_source = 'crates/rumoca/tests/time_event_when_activation.rs'
pin_kind = 'Record'
pin_file = 'crates/rumoca/tests/time_event_when_activation.rs'
pin_anchor = 'REGRESSION INTRODUCED EARLIER'
pin_polarity = 'PinsDivergence'
