[[statements]]
id = 'FS-EQN-001'
statement = 'A when-clause activates on the rising edge of a Boolean activation buffer whose start value is the activation condition evaluated at the initialization instant, so a condition already true there presents no edge.'
tier = 'SpecSourced'
edition = '3.6'
section = '§8.3.5.1'
quote_kind = 'Verbatim'
quote = 'Boolean b(start = x.start > 2); b = x > 2; v1 = if edge(b) then expr1 else pre(v1);'
quote_source = 'crates/rumoca/tests/time_event_when_activation.rs'
pin_kind = 'Test'
pin_file = 'crates/rumoca/tests/time_event_when_activation.rs'
pin_anchor = 'a_state_condition_true_at_the_start_never_activates_on_either_session'
pin_polarity = 'Asserts'
status = 'Enforced'
note = 'rumoca left the buffer at false, which manufactured an edge at the initial event for every already-true activation on both solver paths.'

