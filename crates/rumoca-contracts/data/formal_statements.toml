pin_anchor = 'fn emit_chain('
pin_polarity = 'Asserts'
status = 'Enforced'
note = 'rumoca fixes the orientation from the model itself: sa is the endpoint whose slope class roots on the earlier-declared variable. What that does not pin is a chain endpoint whose slope class holds two variables proven equal; no FluidHeatFlow node proves two slopes equal.'

