[[statements]]
id = 'FS-EXPR-007'
statement = 'A junction of more than two semiLinear ports, whose port enthalpy flows are three different variables constrained only by one sum, has no selected solution at exactly zero flow.'
tier = 'SpecSilent'
rationale = 'MLS §3.7.4.5 states Rule 1 over a *chain*: a sequence of equations that all share one y and one x, whose slopes link end to end. A three-way junction shares neither, so the rule does not reach it — the silence is scoped by the rule the section does state, not merely by the section failing to mention junctions. §3.7.4.5 only *recommends* transforming the underdetermined case away where its rules apply, so leaving the junction rows as written is conformant.'
alternatives_considered = 'Rejecting the shape was considered and refused: a structurally identical model whose x never reaches zero simulates correctly without any transformation, so rejection would take those models too. Inventing a junction rule was refused because any choice of one meaningful solution would be this compiler picking a value the model never states.'
pin_kind = 'Record'
