quote = 'the array dimensions belong to the declaration, so `c[1]` in an equation is a subscript on the declared array, not on the element instance that the subscript selects'
quote_source = 'crates/rumoca-phase-typecheck/src/semantic_scope.rs'
pin_kind = 'Test'
