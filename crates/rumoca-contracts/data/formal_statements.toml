# ---------------------------------------------------------------------------
# Rows added by the executable-reference track (crates/rumoca-reference).
#
# Appended at the end rather than filed into the category blocks above so the
# addition cannot collide textually with concurrent edits to those blocks. Note
# that appending does not protect the *identifiers*: these were allocated
# against the branch head, after a concurrently landed row had already taken
# FS-SIM-015. Check the highest id in each category before adding a row, not
# just the end of this file.
#
# Two of the three rows (FS-EQN-019, FS-SIM-016) pin the differential harness,
# which runs one model through the compiler and through an independently
# written reference semantics and requires them to agree. That makes those pins
# two-sided: they fail when the compiler changes AND when the reference does.
# Two-sided is what a differential pin is, and it is weaker than a one-sided pin
# on exactly one axis — a reader who sees one red must check which side moved
# before concluding the compiler regressed.
#
# FS-SIM-017 is the exception and says so in its own note: it pins a
# reference-only test, because its statement is about how a §8.6 sentence should
# be read rather than about what this compiler does. Its compiler-facing
# consequences are FS-EQN-001 through FS-EQN-004, which carry their own pins in
# the compiler's own tests. No other row here may follow that pattern without
# the same justification: a reference-only pin is evidence about the reference,
# and on its own it says nothing about this tree.
# ---------------------------------------------------------------------------

[[statements]]
id = 'FS-EQN-019'
statement = 'An activation condition is re-evaluated live inside the event iteration while its pre value is seeded once from the instant left limit, so an activation whose operand another activation writes in the same instant still rises, and a guard whose body advances its own threshold still settles.'
tier = 'SpecSilent'
rationale = 'MLS Appendix B fixes the answer and leaves the machinery free. Its event iteration says "solve equations for unknowns, with pre(z) and pre(m) fixed", and a condition variable c := f(relation(v)) is among the unknowns it solves — so conditions are live within the instant, and §8.5 freezing relations *between* events says nothing about *within* one. The silence is in the word "solve": for a self-rescheduling guard `when time >= nextTime` whose body advances nextTime, the inner system has no solution at all with pre held fixed, because the condition is true exactly when the body has not run and false once it has. A tool must therefore choose what "solve" means for an inner system that has no solution, and Appendix B does not choose for it. This tree performs one ordered pass per outer iteration and lets the outer loop, which does advance pre, carry the propagation. That reaches the state Appendix B is defined to stop at without searching for a fixed point that does not exist.'
alternatives_considered = 'An inner fixed point was the first implementation and spins forever on the self-rescheduling shape. Latching every condition at the instant two limits and freezing it for the whole iteration was the second, and it terminates, but it is broader than any section supports and it breaks a cascade: `when time >= 0.5 then x = 3` beside `when x > 2 then y = 1` samples `x > 2` before `x` is written, so the second clause never fires, and never fires afterwards either because by then the condition holds on both limits. Both sessions of this compiler give y = 1, which is what Appendix B gives. Narrowing the latch to only those conditions whose own body writes their operands was considered and refused as unprincipled: it is a syntactic test standing in for a semantic one, and it would have no answer for a condition two activations downstream.'
oracle_consulted = 'None. OpenModelica settles the values a model takes, and on the cascade above it would agree with the answer this row already reaches, so it cannot separate the candidates on the case that matters. What distinguishes them is the self-rescheduling shape, where the disagreement is not about a value but about whether an inner solve terminates — which is a property of a tool, not of a trajectory, and therefore not something an oracle run can settle.'
pin_kind = 'Test'
pin_file = 'crates/rumoca-reference/tests/differential.rs'
pin_anchor = 'hand_written_models_agree_between_reference_and_pipeline'
pin_polarity = 'Asserts'
status = 'Enforced'
note = 'Found by the reference failing twice, not by reasoning, which is why this row is SpecSilent rather than SpecSourced: the first version of the statement asserted the latching rule as though §8.5 required it, and the cascade counterexample above refuted it. The StateConditionCascade and SelfReschedulingCounter cases in the pinned file are the two shapes that pull in opposite directions; a change satisfying only one of them fails the other.'

[[statements]]
id = 'FS-SIM-016'
statement = 'A self-rescheduling time-event guard whose first threshold is not met at the start instant fires on its own grid for the whole run.'
tier = 'SpecSourced'
edition = '3.6'
section = '§8.3.5.1'
quote_kind = 'Paraphrase'
