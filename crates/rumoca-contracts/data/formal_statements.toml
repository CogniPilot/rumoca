note = 'The rk-like session and the reference both count 1, 2, 3, 4 on a 0.2 s grid; the diffsol session never fires the guard at all and leaves the accumulator and the threshold at their start values for the whole run. This is not FS-SIM-009, whose subject is a guard already met at the start and whose own note says a guard not met at the start counts normally, and it is not FS-SIM-011, which is about the accuracy of a located state crossing rather than about a dynamic time event failing to occur. The row is filed against §8.3.5.1 because the reference reaches the firing grid from the edge expansion alone; it is deliberately not filed as OracleImplied, because no omc measurement was taken for it and naming an oracle that was never run would be worse than naming none.'

[[statements]]
id = 'FS-SIM-017'
statement = 'The §8.6 requirement that every variable satisfies v = pre(v) before integration constrains the values pre is seeded from and not the meaning of the operator, so an activation buffer enters the initial instant holding its condition on the start values while initial() is false in that seed.'
tier = 'SpecSilent'
rationale = 'MLS §8.6 says "before the start of the integration, it must be guaranteed that for all variables v, v = pre(v)", and it also says the equations of a when-clause are active during initialization if and only if they are explicitly enabled with initial(). Read as an instruction to make pre the identity operator during initialization, the first sentence contradicts the second: edge(b) becomes b and not b, which is false for every buffer, and `when initial() then ...` can never run. §8.6 does not say which reading it means, and the two are not distinguishable from its text — that is the silence. This tree reads the requirement as a constraint on the values pre starts from: committed is seeded from the start environment, so v = pre(v) holds on entry for every declared variable, while a buffer gated on initial() still sees a rising edge because its own seed is evaluated with initial() false.'
alternatives_considered = 'Making pre the identity during initialization was implemented first and refused when it silently disabled every initial()-gated when-clause — a failure that no start-value test detects, because it changes nothing about start values. Seeding buffers to false unconditionally was refused because it manufactures a rising edge at the initial instant for every already-true condition, which is precisely the defect FS-EQN-001 records having fixed. Evaluating the seed with initial() true was refused because it removes the only edge an initial()-gated clause can have, arriving back at the first alternative by a different route.'
oracle_consulted = 'None was run for this row. The observable consequences are already settled by omc through FS-EQN-001 to FS-EQN-004, which this reading reproduces; what is unsettled is the interpretation those rows leave implicit, and an oracle returns trajectories rather than interpretations. The row exists so the choice is written down where the next reader of §8.6 will look, rather than being rediscovered from a failing test.'
pin_kind = 'Test'
pin_file = 'crates/rumoca-reference/tests/semantics.rs'
pin_anchor = 'an_initial_gated_activation_runs_at_initialization'
pin_polarity = 'Asserts'
status = 'Enforced'
note = 'Unlike the two rows above, this pin exercises the reference alone. It is admissible here because the statement is about an interpretation of §8.6 rather than about compiler behavior — the compiler-facing consequences are FS-EQN-001 through FS-EQN-004, which carry their own pins in crates/rumoca/tests/time_event_when_activation.rs. A reader wanting evidence about this tree should follow those.'
