[package]
name = "rumoca-tool-lsp-galec"
description = "Language Server Protocol implementation for GALEC (.alg), the eFMI Algorithm Code language"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rumoca-lsp-galec"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
# The WASM-safe layer depends only on the protocol-neutral foundation types,
# lsp-types, and the GALEC language module.
rumoca-core = { workspace = true }
rumoca-phase-parse-galec = { workspace = true }
lsp-types = { workspace = true }

# Native stdio server only (a future WASM .alg playground reuses the layer above
# with `default-features = false`). Unlike the Modelica LSP, GALEC's server needs
# no solver/simulation backends — only parse + validate — so it stays lean.
tower-lsp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
clap = { workspace = true, optional = true }

[features]
default = ["server"]
server = ["dep:tower-lsp", "dep:tokio", "dep:clap"]

[dev-dependencies]
futures-util = { workspace = true }

[lints]
workspace = true
