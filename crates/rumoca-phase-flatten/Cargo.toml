[package]
name = "rumoca-phase-flatten"
description = "Flatten phase for the Rumoca Modelica compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
tracing = ["dep:tracing", "rumoca-eval-flat/tracing"]

[dependencies]
rumoca-core = { workspace = true }
rumoca-eval-ast = { workspace = true }
rumoca-eval-flat = { workspace = true }
rumoca-ir-ast = { workspace = true }
rumoca-ir-flat = { workspace = true }
# SPEC_0029 §4 forward proof edge `flatten -> typecheck`: the sole flatten
# entry names the Typecheck-minted `TypedInstancedTree` in its own mint input
# position and calls only its immutable query views.
rumoca-phase-typecheck = { workspace = true }
indexmap = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
miette = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
rumoca-ir-dae = { workspace = true }
rumoca-phase-dae = { workspace = true }
rumoca-phase-instantiate = { workspace = true }
rumoca-phase-parse = { workspace = true }
rumoca-phase-resolve = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
