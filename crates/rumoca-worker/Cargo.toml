[package]
name = "rumoca-worker"
description = "Isolated model compilation and simulation worker for rumoca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rumoca-worker"
path = "src/bin/rumoca-worker.rs"

[dependencies]
clap = { workspace = true }
core_affinity = { workspace = true }
mimalloc = { workspace = true }
rumoca-compile = { workspace = true, features = ["strict-ir-validation"] }
rumoca-core = { workspace = true }
rumoca-phase-solve = { workspace = true }
# Canonical `ES0xx` registry used by `diagnostic_codes` instead of re-declaring
# the codes the MSL result schema reports.
rumoca-phase-structural = { workspace = true }
# Match the MSL tooling graph: it consumes rumoca-sim's report-gated web
# assets, and the release parity build intentionally links this worker in that
# same Cargo invocation. Keeping the feature set identical lets a subsequent
# focused worker build reuse the release artifact instead of re-LTO-linking it.
rumoca-sim = { workspace = true, features = ["solver-diffsol", "strict-ir-validation", "report"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }

[lints]
workspace = true
