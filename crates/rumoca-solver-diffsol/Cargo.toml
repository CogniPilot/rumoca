[package]
name = "rumoca-solver-diffsol"
description = "Diffsol-backed simulation runtime for Rumoca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rumoca-solver = { workspace = true }
rumoca-eval-solve = { workspace = true }
rumoca-ir-solve = { workspace = true }
indexmap = { workspace = true }
diffsol = { version = "0.13" }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rumoca-exec-cranelift = { workspace = true }

[dev-dependencies]
# SPEC_0039 / SOLVE-C17: pattern fixtures are a test-only surface. Declaring
# the feature here and nowhere else keeps it out of every production build of
# this crate.
rumoca-ir-solve = { workspace = true, features = ["pattern-fixtures"] }

[lints]
workspace = true
