[package]
name = "rumoca-solver-diffsol"
description = "Diffsol-backed simulation runtime for Rumoca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# The backend implements only rumoca-solver's FMI ME numerical-plugin
# interface; simulation orchestration and model construction live upstream.
rumoca-solver = { workspace = true }
diffsol = { version = "0.13" }
self_cell = { workspace = true }

[dev-dependencies]
# The backend regression drives this crate's real integrator through the
# checked FMI ME plugin contract using rumoca-solver's feature-gated harness.
rumoca-solver = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
